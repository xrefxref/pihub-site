<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='22' font-size='18' font-family='sans-serif' fill='white' text-anchor='middle'>规</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深圳规划考察助手</title>
  <meta name="description" content="为规划师、工程师、建筑师等专业人士量身打造的城市建设与设计考察路线规划工具，精选深圳规划优秀项目，按考察主题推荐并生成最优路线。" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- 预置主题，避免首屏闪烁 -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('szpdi_theme') || 'system';
        var t = m === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <noscript style="display:block;padding:2rem;text-align:center;font-family:sans-serif">

  </noscript>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
